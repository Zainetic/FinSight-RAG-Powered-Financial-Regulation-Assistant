name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finsight_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finsight_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          pip install ruff pip-audit

      - name: Code Quality & Linting (ruff)
        working-directory: backend
        run: |
          ruff check .

      - name: Dependency Vulnerability Audit (pip-audit)
        working-directory: backend
        run: |
          pip-audit -r requirements.txt || echo "::warning::Known dependency advisories detected. Review backend/requirements.txt."

      - name: Run Backend Tests with Pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finsight_db
          JWT_SECRET_KEY: ci-test-secret-key-32-chars-long-2026
        run: |
          pytest tests test_multitenancy_rbac.py -v -p no:warnings

  frontend-lint-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Dependency Security Audit (npm audit)
        working-directory: frontend
        run: |
          npm audit --audit-level=high || echo "::warning::High-severity advisories detected in upstream frontend dependencies."

      - name: Run Frontend Lint
        working-directory: frontend
        run: npm run lint

      - name: Build Next.js Application
        working-directory: frontend
        run: npm run build
