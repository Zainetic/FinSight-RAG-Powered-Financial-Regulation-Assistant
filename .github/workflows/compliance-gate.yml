name: RegTech Compliance Gate

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  run-compliance-audit:
    runs-on: ubuntu-latest
    env:
      FINSIGHT_URL: ${{ secrets.FINSIGHT_URL }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Scan Preconditions
        if: github.event_name != 'workflow_dispatch' && env.FINSIGHT_URL == ''
        run: |
          echo "Compliance gate external scan skipped: FINSIGHT_URL repository secret is not set."
          echo "To enable automated PR compliance audits, configure the FINSIGHT_URL secret in repository settings."

      - name: Execute FInSIght Scan
        if: github.event_name == 'workflow_dispatch' || env.FINSIGHT_URL != ''
        run: |
          if [ -z "$FINSIGHT_URL" ]; then
            echo "FINSIGHT_URL secret is not configured. Skipping scan."
            exit 0
          fi
          BASE_URL="${FINSIGHT_URL%/}"
          COMMIT_HASH="${{ github.event.pull_request.head.sha || github.sha }}"
          curl -f -X POST "${BASE_URL}/api/v1/scan-repo" \
            -H "Content-Type: application/json" \
            -d "{
              \"repo_name\": \"${{ github.repository }}\",
              \"commit_hash\": \"${COMMIT_HASH}\",
              \"architecture_changes\": \"Automated PR scan initiated.\"
            }"