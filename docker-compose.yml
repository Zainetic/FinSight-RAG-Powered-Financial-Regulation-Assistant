services:
  # The PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: finsight_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finsight_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - finsight_network

  # The Streamlit Web App Service
  web:
    build: .
    container_name: finsight_ui
    restart: always
    env_file:
      - .env
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - finsight_network

volumes:
  postgres_data:

networks:
  finsight_network:
    driver: bridge
