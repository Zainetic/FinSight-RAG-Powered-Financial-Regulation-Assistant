services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: finsight_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finsight_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - finsight_network

  # 2. FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finsight_backend
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - finsight_network

  # 3. Next.js Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finsight_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - finsight_network

volumes:
  postgres_data:

networks:
  finsight_network:
    driver: bridge